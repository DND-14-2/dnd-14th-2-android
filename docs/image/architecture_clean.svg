<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="540" fill="#F6F6F9" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#187674">Clean Architecture</text>

  <!-- ============================================================ -->
  <!--  LEFT PANEL – Concentric Ring Diagram                        -->
  <!-- ============================================================ -->

  <!-- Outermost ring: Data -->
  <circle cx="270" cy="295" r="200" fill="#187674" fill-opacity="0.18" stroke="#187674" stroke-width="2.5"/>

  <!-- Middle ring: Domain -->
  <circle cx="270" cy="295" r="134" fill="#2BC4C1" fill-opacity="0.22" stroke="#2BC4C1" stroke-width="2.5"/>

  <!-- Inner ring: Presentation -->
  <circle cx="270" cy="295" r="70" fill="#ECFAF9" stroke="#2BC4C1" stroke-width="2.5"/>

  <!-- Presentation label (center) -->
  <text x="270" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#187674">Presentation</text>
  <text x="270" y="307" text-anchor="middle" font-size="10.5" fill="#22A3A0">Layer</text>

  <!-- Domain label (ring) -->
  <text x="270" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#187674">Domain</text>
  <text x="270" y="198" text-anchor="middle" font-size="10.5" fill="#22A3A0">Layer</text>

  <!-- Data label (outer ring) -->
  <text x="270" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#187674">Data</text>
  <text x="270" y="122" text-anchor="middle" font-size="10.5" fill="#22A3A0">Layer</text>

  <!-- Dependency Direction Arrow (outer → center) -->
  <defs>
    <marker id="dep" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2BC4C1"/>
    </marker>
    <marker id="depW" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFFFFF"/>
    </marker>
    <marker id="depG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8E8E93"/>
    </marker>
  </defs>

  <!-- Dependency arrows inside the ring diagram -->
  <path d="M270,484 Q270,460 270,432" stroke="#187674" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#dep)"/>
  <text x="295" y="462" font-size="9.5" fill="#8E8E93">의존 방향</text>

  <!-- ============================================================ -->
  <!--  RIGHT PANEL – Module detail cards                           -->
  <!-- ============================================================ -->

  <!-- === PRESENTATION CARD === -->
  <rect x="500" y="66" width="368" height="126" rx="14" fill="#ECFAF9" stroke="#2BC4C1" stroke-width="2"/>
  <rect x="500" y="66" width="368" height="36" rx="14" fill="#2BC4C1"/>
  <rect x="500" y="86" width="368" height="16" fill="#2BC4C1"/>
  <text x="684" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Presentation Layer</text>

  <rect x="518" y="110" width="100" height="30" rx="8" fill="#FFFFFF" stroke="#AEE8E5" stroke-width="1.2"/>
  <text x="568" y="129" text-anchor="middle" font-size="11" fill="#202020">Screen</text>
  <rect x="630" y="110" width="100" height="30" rx="8" fill="#FFFFFF" stroke="#AEE8E5" stroke-width="1.2"/>
  <text x="680" y="129" text-anchor="middle" font-size="11" fill="#202020">ViewModel</text>
  <rect x="742" y="110" width="108" height="30" rx="8" fill="#FFFFFF" stroke="#AEE8E5" stroke-width="1.2"/>
  <text x="796" y="129" text-anchor="middle" font-size="11" fill="#202020">Design System</text>

  <text x="684" y="176" text-anchor="middle" font-size="10.5" fill="#8E8E93">Jetpack Compose · Navigation · Hilt ViewModel · StateFlow</text>

  <!-- === DOMAIN CARD === -->
  <rect x="500" y="210" width="368" height="136" rx="14" fill="#D4F3F1" fill-opacity="0.60" stroke="#22A3A0" stroke-width="2"/>
  <rect x="500" y="210" width="368" height="36" rx="14" fill="#22A3A0"/>
  <rect x="500" y="230" width="368" height="16" fill="#22A3A0"/>
  <text x="684" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Domain Layer</text>

  <rect x="518" y="255" width="100" height="30" rx="8" fill="#FFFFFF" stroke="#74D6D3" stroke-width="1.2"/>
  <text x="568" y="274" text-anchor="middle" font-size="11" fill="#202020">UseCase</text>
  <rect x="630" y="255" width="110" height="30" rx="8" fill="#FFFFFF" stroke="#74D6D3" stroke-width="1.2"/>
  <text x="685" y="274" text-anchor="middle" font-size="11" fill="#202020">Repository (I/F)</text>
  <rect x="752" y="255" width="98" height="30" rx="8" fill="#FFFFFF" stroke="#74D6D3" stroke-width="1.2"/>
  <text x="801" y="274" text-anchor="middle" font-size="11" fill="#202020">Domain Model</text>

  <text x="684" y="310" text-anchor="middle" font-size="10.5" fill="#8E8E93">Ledger · Auth · Nickname · User · Onboarding</text>
  <text x="684" y="328" text-anchor="middle" font-size="10.5" fill="#8E8E93">Pure Kotlin · Coroutines Flow · No Android Dependency</text>

  <!-- === DATA CARD === -->
  <rect x="500" y="364" width="368" height="152" rx="14" fill="#187674" fill-opacity="0.10" stroke="#187674" stroke-width="2"/>
  <rect x="500" y="364" width="368" height="36" rx="14" fill="#187674"/>
  <rect x="500" y="384" width="368" height="16" fill="#187674"/>
  <text x="684" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Data Layer</text>

  <rect x="518" y="410" width="106" height="30" rx="8" fill="#FFFFFF" stroke="#22A3A0" stroke-width="1.2"/>
  <text x="571" y="429" text-anchor="middle" font-size="11" fill="#202020">Repository Impl</text>
  <rect x="636" y="410" width="106" height="30" rx="8" fill="#FFFFFF" stroke="#22A3A0" stroke-width="1.2"/>
  <text x="689" y="429" text-anchor="middle" font-size="11" fill="#202020">Remote Source</text>
  <rect x="754" y="410" width="96" height="30" rx="8" fill="#FFFFFF" stroke="#22A3A0" stroke-width="1.2"/>
  <text x="802" y="429" text-anchor="middle" font-size="11" fill="#202020">Local Source</text>

  <text x="600" y="462" text-anchor="middle" font-size="10.5" fill="#8E8E93">Retrofit · OkHttp · Kotlinx Serialization</text>
  <text x="790" y="462" text-anchor="middle" font-size="10.5" fill="#8E8E93">Room · DataStore</text>
  <text x="684" y="480" text-anchor="middle" font-size="10" fill="#8E8E93">TokenEncryption · TokenAuthenticator · Hilt DI</text>
  <line x1="684" y1="450" x2="684" y2="456" stroke="#C7C7CC" stroke-width="1"/>

  <!-- Dependency arrows between right cards -->
  <line x1="684" y1="192" x2="684" y2="210" stroke="#2BC4C1" stroke-width="2" marker-end="url(#dep)"/>
  <line x1="684" y1="346" x2="684" y2="364" stroke="#22A3A0" stroke-width="2" marker-end="url(#dep)"/>

  <!-- "의존성 규칙" label top right -->
  <rect x="500" y="516" width="368" height="18" rx="6" fill="none"/>
  <text x="684" y="530" text-anchor="middle" font-size="10.5" fill="#8E8E93">⬆ 내부 레이어는 외부 레이어를 알지 못함 (Dependency Rule)</text>

</svg>
